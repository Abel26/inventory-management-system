# Installation Instructions:
# 1. Copy this file to /etc/nginx/sites-available/inventory-management-ssl
# 2. Replace app.ebara.com with your actual domain
# 3. Adjust PHP version if needed (php8.1-fpm.sock)
# 4. Adjust file paths if your Laravel installation is in different location
# 5. Enable site: sudo ln -s /etc/nginx/sites-available/inventory-management-ssl /etc/nginx/sites-enabled/
# 6. Test config: sudo nginx -t
# 7. Restart Nginx: sudo systemctl restart nginx